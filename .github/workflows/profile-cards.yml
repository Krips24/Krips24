name: Refresh profile cards

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install font subsetting tools
        run: python -m pip install fonttools
      - name: Refresh contributions and render cards
        run: python render_cards.py --refresh-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit refreshed data and cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.json cards/
          if git diff --cached --quiet; then
            echo "Contribution data and cards are already current."
          else
            git commit -m "chore: refresh animated profile cards"
            git push
          fi
